[package]
name = "coretests"
version = "0.0.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rust-lang/rust.git"
description = "Tests for the Rust Core Library"
autotests = false
autobenches = false
edition = "2024"

[lib]
path = "lib.rs"
test = false
bench = false
doc = false

[[test]]
name = "coretests"
path = "tests/lib.rs"

# FIXME(cheri/excluded/triage): wants libtest
# [[bench]]
# name = "corebenches"
# path = "benches/lib.rs"
# test = true

[dev-dependencies]
rand = { version = "0.9.0", default-features = false }
rand_xorshift = { version = "0.4.0", default-features = false }

[target.'cfg(target_abi = "cheriot")'.dev-dependencies]
test = { package = "cheri_test", path = "../../cheri/ci/library/cheri_test" }

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    # Internal features aren't marked known config by default, we use these to
    # gate tests.
    'cfg(target_has_reliable_f16)',
    'cfg(target_has_reliable_f16_math)',
    'cfg(target_has_reliable_f128)',
    'cfg(target_has_reliable_f128_math)',
]

[features]
# Enabling these features tells our linker to include the particular RTOS libraries.
needs_math = []
needs_softfloat = []
# Each of these features enables a subset of tests which can fit in our simulator memory.
test_alloc = []
test_any = []
test_array = []
test_ascii = []
test_ascii_char = []
test_asserting = []
test_async_iter = []
test_atomic = []
test_bool = []
test_bstr = []
test_cell = []
test_char = []
test_clone = []
test_cmp = []
test_const_ptr = []
test_convert = []
test_ffi = []
test_fmt = []
test_fmt_builders = []
test_fmt_float = ["needs_softfloat"]
test_fmt_num = ["needs_softfloat"]
test_future = []
test_hash = []
test_hint = []
test_index = []
test_intrinsics = []
test_io = []
test_iter = ["needs_softfloat"]
test_iter_adapters = []
test_lazy = []
test_macros = []
test_manually_drop = []
test_mem = []
test_net_ip_addr = []
test_net_parser = []
test_net_socket_addr = []
test_nonzero = []
test_num = []
test_num_cast_checked_uint = []
test_num_cast_checked_int = []
test_num_cast_bounded_uint = []
test_num_cast_bounded_int = []
test_num_dec2flt = ["needs_softfloat"]
test_num_dec2flt_parse = ["needs_softfloat"]
test_num_flt2dec = ["needs_math", "needs_softfloat"]
test_num_flt2dec_dragon = ["needs_softfloat"]
test_num_flt2dec_grisu = ["needs_softfloat"]
test_num_f16 = ["needs_math", "needs_softfloat"]
test_num_f32 = ["needs_math", "needs_softfloat"]
test_num_f64 = ["needs_math", "needs_softfloat"]
test_num_f128 = []
test_num_ieee754 = ["needs_softfloat"]
test_num_int_log = ["needs_math", "needs_softfloat"]
test_num_rest = []
test_ops = []
test_option = []
test_panic = []
test_pattern = []
test_pin = []
test_pin_macro = []
test_ptr = []
test_result = []
test_simd = []
test_slice = []
test_str = []
test_str_lossy = []
test_task = []
test_time = []
test_tuple = []
test_unicode = []
test_waker = []
test_wtf8 = []
