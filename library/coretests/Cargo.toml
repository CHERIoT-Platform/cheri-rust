[package]
name = "coretests"
version = "0.0.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rust-lang/rust.git"
description = "Tests for the Rust Core Library"
autotests = false
autobenches = false
edition = "2024"

[lib]
path = "lib.rs"
test = false
bench = false
doc = false

[[test]]
name = "coretests"
path = "tests/lib.rs"

[[bench]]
name = "corebenches"
path = "benches/lib.rs"
test = true

[dev-dependencies]
rand = { version = "0.9.0", default-features = false }
rand_xorshift = { version = "0.4.0", default-features = false }

[target.'cfg(target_abi = "cheriot")'.dev-dependencies]
test = { package = "cheri_test", path = "../../cheri/ci/library/cheri_test"}

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    # Internal features aren't marked known config by default, we use these to
    # gate tests.
    'cfg(target_has_reliable_f16)',
    'cfg(target_has_reliable_f16_math)',
    'cfg(target_has_reliable_f128)',
    'cfg(target_has_reliable_f128_math)',
]

[features]
test_alloc = []
test_any = []
test_array = []
test_ascii = []
test_ascii_char = []
test_asserting = []
test_async_iter = []
test_atomic = []
test_bool = []
test_bstr = []
test_cell = []
test_char = []
test_clone = []
test_cmp = []
test_const_ptr = []
test_convert = []
test_ffi = []
test_fmt = []
test_fmt_builders = []
test_fmt_float = []
test_fmt_num = []
test_future = []
test_hash = []
test_hint = []
test_index = []
test_intrinsics = []
test_io = []
test_iter = []
test_iter_adapters = []
test_lazy = []
test_macros = []
test_manually_drop = []
test_mem = []
test_net = []
test_nonzero = []
test_num = []
test_num_rest = []
test_ops = []
test_option = []
test_panic = []
test_pattern = []
test_pin = []
test_pin_macro = []
test_ptr = []
test_result = []
test_simd = []
test_slice = []
test_str = []
test_str_lossy = []
test_task = []
test_time = []
test_tuple = []
test_unicode = []
test_waker = []
test_wtf8 = []
