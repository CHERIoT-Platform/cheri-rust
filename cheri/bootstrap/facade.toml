change-id = "ignore"

[build]
rustfmt = "./build/host/stage1/bin/rustfmt"
description = "cheri-rust"

[rust]
channel = "dev"
std-features = ["compiler-builtins-mem", "optimize_for_size"]

[llvm]
download-ci-llvm = false
targets = "all"
experimental-targets = ""
assertions = true

[llvm.build-config]
LLVM_ENABLE_PROJECTS = "clang;lld"
