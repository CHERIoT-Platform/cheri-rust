name: Autobump LLVM (CHERIoT)

on:
  # TODO: Uncomment before merging.
  # schedule:
  #   # Create a PR to bump LLVM every Thursday at 11 a.m.
  #   - cron: "0 11 * * 4"
  pull_request:
    branches:
      - "**"

permissions:
  contents: write
  pull-requests: write

jobs:
  bump_llvm:
    runs-on: cirun-gcp-aarch64--${{ github.run_id }}
    timeout-minutes: 240
    steps:
      # Create a PK that will be used later to create the PR.
      - uses: actions/create-github-app-token@v2
        id: generate-token
        with:
          app-id: ${{ secrets.CHERI_PR_AUTOMATOR_APP_ID }}
          private-key: ${{ secrets.CHERI_PR_AUTOMATOR_APP_PK }}
      - name: Install GH CLI
        run: |
          set -eo pipefail
          sudo apt update
          sudo apt install -y git
          wget https://github.com/cli/cli/releases/download/v2.93.0/gh_2.93.0_linux_arm64.deb
          sudo dpkg -i gh_2.93.0_linux_arm64.deb
      - name: Does GH CLI work?
        run: gh auth status
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
      - uses: actions/checkout@v5
        name: Checkout
        with:
          fetch-depth: 2
          # TODO: src/ci/scripts/checkout-submodules.sh should be faster
          submodules: recursive
      - name: Pull changes from LLVM
        run: |
          cd src/llvm-project
          echo "CURRENT_LLVM_COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          git pull
          echo "NEXT_LLVM_COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Create commit
        if: env.CURRENT_LLVM_COMMIT != env.NEXT_LLVM_COMMIT
        run: |
          git add src/llvm-project && git commit -m "Bump LLVM to $NEXT_LLVM_COMMIT"
          echo "BRANCH_NAME=autobump-llvm-$NEXT_LLVM_COMMIT-$(date +"%d-%m-%y")" >> $GITHUB_ENV

      - name: Switch branch
        if: env.CURRENT_LLVM_COMMIT != env.NEXT_LLVM_COMMIT
        run: |
          git switch -c ${{ env.BRANCH_NAME }}

      - name: Push to branch
        if: env.CURRENT_LLVM_COMMIT != env.NEXT_LLVM_COMMIT
        run: |
          git config --global push.autoSetupRemote true
          git push

      - name: Create PR
        if: env.CURRENT_LLVM_COMMIT != env.NEXT_LLVM_COMMIT
        run: gh pr create -base="beta" --title="[Weekly Autobump] Bump LLVM to $NEXT_LLVM_COMMIT" --body="Good luck!"
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
