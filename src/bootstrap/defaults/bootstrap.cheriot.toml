[build]
description = "cheri-rust"
locked-deps = true

[rust]
channel = "dev"
codegen-units-std = 1
debug-assertions = true
debug-logging = true
# See https://github.com/CHERIoT-Platform/cheri-rust/issues/202
optimize = 3
overflow-checks = true
std-features = ["compiler-builtins-mem"]
verify-llvm-ir = true

[llvm]
download-ci-llvm = false
targets = "all"
experimental-targets = ""
assertions = true

[llvm.build-config]
LLVM_ENABLE_PROJECTS = "clang;lld"
